changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Performance & Reliability
      labels:
        - performance
        - reliability
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
