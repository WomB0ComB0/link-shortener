name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'SemVer release tag (e.g. v2.0.0 or v2.0.0-rc.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark GitHub Release as prerelease (auto-detected if tag contains "-")'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-link-shortener
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate SemVer Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Resolve and validate SemVer tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer tag '$TAG'. Expected vMAJOR.MINOR.PATCH (optional -prerelease)."
            exit 1
          fi

          VERSION="${TAG#v}"
          IS_PRERELEASE="false"
          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  verify-and-build:
    name: Test, Audit & Build Nitro Release Bundle
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit test suite & dependency audit
        run: |
          bun run test
          bun audit --audit-level=high

      - name: Build production Nuxt/Nitro bundle
        run: bun run build

      - name: Package versioned release tarball & SHA256SUMS
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -czf "release-assets/link-shortener-${TAG}.tar.gz" -C .output .
          (cd release-assets && sha256sum "link-shortener-${TAG}.tar.gz" > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Upload release assets artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          retention-days: 7

  github-release:
    name: Create GitHub Release
    needs: [prepare, verify-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packaged release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          cat <<EOF > release-notes-header.md
          ### Verification Checksums (SHA-256)
          \`\`\`
          $(cat release-assets/SHA256SUMS.txt)
          \`\`\`
          EOF

          PRERELEASE_FLAG=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "release-assets/link-shortener-${TAG}.tar.gz" \
              "release-assets/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$TAG" \
              "release-assets/link-shortener-${TAG}.tar.gz" \
              "release-assets/SHA256SUMS.txt" \
              --target "$GITHUB_SHA" \
              --title "Links ${TAG}" \
              --generate-notes \
              --notes-file release-notes-header.md \
              "${PRERELEASE_FLAG[@]}"
          fi
